<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация в СКУД | ПЛ №3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #4f46e5;
        --accent-light: #eef2ff;
        --bg: #f1f5f9;
        --card: #fff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --ok: #16a34a;
        --warn: #d97706;
        --bad: #dc2626;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Golos Text", "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      header {
        background: #0f172a;
        color: #fff;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header a {
        color: #cbd5e1;
        text-decoration: none;
        font-size: 14px;
      }
      header h1 {
        font-size: 18px;
        font-weight: 700;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      .bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      select,
      input[type="text"] {
        font: inherit;
        padding: 10px 12px;
        border: 2px solid var(--border);
        border-radius: 10px;
        background: #fff;
        min-width: 0;
      }
      input[type="text"] {
        flex: 1;
        min-width: 180px;
      }
      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .list {
        display: grid;
        gap: 8px;
      }
      .row {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        align-items: center;
      }
      .row h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
      }
      .chip {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 99px;
        background: #e2e8f0;
        color: #334155;
        white-space: nowrap;
      }
      .chip.done {
        background: #dcfce7;
        color: var(--ok);
      }
      .chip.partial {
        background: #fef3c7;
        color: var(--warn);
      }
      .chip.failed {
        background: #fee2e2;
        color: var(--bad);
      }
      .chip.pending,
      .chip.processing {
        background: var(--accent-light);
        color: var(--accent);
      }
      .side {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.ghost {
        background: #fff;
        color: var(--accent);
        border: 2px solid var(--accent-light);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .err {
        grid-column: 1/-1;
        font-size: 12px;
        color: var(--bad);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
      }
      dialog {
        border: 0;
        border-radius: 16px;
        padding: 20px;
        width: min(400px, 94vw);
        margin: auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.5);
      }
      dialog h2 {
        font-size: 17px;
        margin-bottom: 2px;
      }
      dialog .meta {
        margin-bottom: 14px;
      }
      .shot {
        display: grid;
        place-items: center;
        height: 260px;
        border: 2px dashed var(--border);
        border-radius: 12px;
        overflow: hidden;
        background: #f8fafc;
        margin-bottom: 12px;
        cursor: pointer;
        color: var(--muted);
        text-align: center;
        padding: 10px;
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .msg {
        font-size: 13px;
        min-height: 20px;
        margin-bottom: 10px;
      }
      .msg.bad {
        color: var(--bad);
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← Админка</a>
      <h1>Регистрация в СКУД</h1>
    </header>
    <main>
      <p class="note">
        Выберите группу, сфотографируйте студента анфас. Фото уйдёт на терминалы
        через локальный агент, обычно за несколько секунд.
      </p>
      <div class="bar">
        <select id="group" aria-label="Группа">
          <option value="">Группа…</option>
        </select>
        <input
          type="text"
          id="q"
          placeholder="или поиск по ФИО"
          aria-label="Поиск по ФИО"
        />
      </div>
      <div class="list" id="list">
        <div class="empty">Выберите группу или введите ФИО</div>
      </div>
    </main>

    <dialog id="dlg">
      <h2 id="d-name"></h2>
      <div class="meta" id="d-meta"></div>
      <label class="shot" id="shot" for="file"
        ><span
          >Нажмите, чтобы сделать фото<br />(анфас, без очков и головного
          убора)</span
        ></label
      >
      <input type="file" id="file" accept="image/*" capture="user" hidden />
      <div class="msg" id="msg" role="status"></div>
      <div class="actions">
        <button class="ghost" id="cancel" type="button">Отмена</button
        ><button id="send" type="button" disabled>Отправить в СКУД</button>
      </div>
    </dialog>

    <script>
      const $ = (id) => document.getElementById(id);
      const LABEL = {
        none: "не отправлен",
        pending: "в очереди",
        processing: "отправляется",
        done: "в СКУД",
        partial: "не на всех",
        failed: "ошибка",
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      let items = [],
        current = null,
        blob = null,
        timer = null;

      async function j(url, opt) {
        const r = await fetch(url, opt);
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "Ошибка " + r.status);
        return d;
      }

      async function loadGroups() {
        const gs = await j("/api/admin/skud-reg/groups");
        $("group").innerHTML =
          '<option value="">Группа…</option>' +
          gs
            .map((g) => `<option value="${g._id}">${esc(g.name)}</option>`)
            .join("");
      }

      async function load() {
        const gid = $("group").value,
          q = $("q").value.trim();
        if (!gid && q.length < 2) {
          items = [];
          render();
          return;
        }
        items = await j(
          "/api/admin/skud-reg/students?" +
            (gid ? "groupId=" + gid : "q=" + encodeURIComponent(q)),
        );
        render();
        clearTimeout(timer);
        if (
          items.some((s) => s.status === "pending" || s.status === "processing")
        )
          timer = setTimeout(load, 4000);
      }

      function render() {
        $("list").innerHTML = items.length
          ? items
              .map((s) => {
                const errs = s.results
                  .filter((r) => !r.ok)
                  .map((r) => `${esc(r.ip)}: ${esc(r.error)}`)
                  .join("<br>");
                const busy =
                  s.status === "pending" || s.status === "processing";
                return `<div class="row">
      <div><h3>${esc(s.fio)}</h3><div class="meta">${esc(s.group)} · ИНН ${esc(s.inn) || "—"} · № ${esc(s.lyceumId) || "—"}</div></div>
      <div class="side"><span class="chip ${s.status}">${LABEL[s.status]}</span>
        <button data-id="${s.id}" ${!s.ready || busy ? "disabled" : ""} class="${s.status === "done" ? "ghost" : ""}">${s.status === "done" ? "Заменить фото" : "Фото"}</button></div>
      ${!s.ready ? '<div class="err">Заполните ИНН и поименный № в карточке студента</div>' : ""}
      ${errs ? `<div class="err">${errs}</div>` : ""}
    </div>`;
              })
              .join("")
          : '<div class="empty">Ничего не найдено</div>';
      }

      $("list").onclick = (e) => {
        const b = e.target.closest("button[data-id]");
        if (!b) return;
        current = items.find((s) => s.id === b.dataset.id);
        blob = null;
        $("send").disabled = true;
        $("msg").textContent = "";
        $("msg").className = "msg";
        $("shot").innerHTML =
          "<span>Нажмите, чтобы сделать фото<br>(анфас, без очков и головного убора)</span>";
        $("d-name").textContent = current.fio;
        $("d-meta").textContent = `ИНН ${current.inn} · № ${current.lyceumId}`;
        $("dlg").showModal();
      };
      $("cancel").onclick = () => $("dlg").close();

      // Уменьшаем до 640px и подбираем качество, чтобы JPEG был не больше 200 КБ
      async function shrink(file) {
        const img = await createImageBitmap(file, {
          imageOrientation: "from-image",
        });
        const k = Math.min(1, 640 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        for (const q of [0.85, 0.75, 0.65, 0.55, 0.45]) {
          const b = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
          if (b.size <= 190 * 1024) return b;
        }
        throw new Error("Не удалось уменьшить фото, попробуйте другое");
      }

      $("file").onchange = async () => {
        const f = $("file").files[0];
        if (!f) return;
        try {
          blob = await shrink(f);
          $("shot").innerHTML =
            `<img alt="Предпросмотр" src="${URL.createObjectURL(blob)}">`;
          $("send").disabled = false;
          $("msg").textContent = "";
        } catch (e) {
          $("msg").textContent = e.message;
          $("msg").className = "msg bad";
        }
        $("file").value = "";
      };

      $("send").onclick = async () => {
        $("send").disabled = true;
        $("msg").className = "msg";
        $("msg").textContent = "Отправка…";
        try {
          const fd = new FormData();
          fd.append("photo", blob, "face.jpg");
          const d = await j("/api/admin/skud-reg/" + current.id, {
            method: "POST",
            body: fd,
          });
          $("dlg").close();
          await load();
        } catch (e) {
          $("msg").textContent = e.message;
          $("msg").className = "msg bad";
          $("send").disabled = false;
        }
      };

      $("group").onchange = () => {
        $("q").value = "";
        load();
      };
      $("q").oninput = () => {
        $("group").value = "";
        clearTimeout($("q")._t);
        $("q")._t = setTimeout(load, 300);
      };
      loadGroups();
    </script>
  </body>
</html>
