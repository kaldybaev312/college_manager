<style>
/* Рабочий инструмент: спокойный светлый интерфейс, синий «чернильный» акцент, документы набраны серифом как на бланке */
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

.brand{font-weight:600;color:var(--ink);font-size:17px;margin-right:auto}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:#EBEEF4;border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font:500 14px var(--sans);color:#4F5869;cursor:pointer}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

.muted{color:var(--muted)}

<script>
const html = htm.bind(React.createElement);
const { useState, useEffect } = React;

/* =================== константы лицея =================== */
const LY = {
  name: "Профессиональный лицей №3",
  directorGen: "Белялова Ш.А.",
  address: "ул. Раззакова, 62",
  phone: "0312 62-49-12",

/* Страница лежит в pl3service (public/practice.html) — API на том же сайте, вход по той же сессии */
const ON_PL3 = location.protocol.startsWith("http") && !/vercel\.app$/.test(location.hostname);
const DEFAULT_SETTINGS = {
  apiBase: ON_PL3 ? "" : "https://pl3service.onrender.com",
  groupsPath: "/api/admin/groups-list",
  studentsPath: "/api/admin/group-students/{group}",
  token: "",

/* =================== утилиты =================== */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const code4 = () => Math.random().toString(36).slice(2, 6).toUpperCase();
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const TODAY = iso(new Date());
const fmt = (d) => { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${dd}.${m}.${y}`; };
const MG = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const longDate = (d) => { const [y, m, dd] = d.split("-"); return `${+dd} ${MG[m - 1]} ${y} г.`; };
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const wd = (d) => WD[new Date(d + "T00:00").getDay()];
const short = (fio = "") => { const [f, i, o] = fio.trim().split(/\s+/); return `${f || ""} ${i ? i[0] + "." : ""}${o ? o[0] + "." : ""}`.trim(); };
const sumHours = (p) => p.days.reduce((a, d) => a + Number(d.hours || 0), 0);
const GW = { 2: "неудовлетворительно", 3: "удовлетворительно", 4: "хорошо", 5: "отлично" };
const clone = (o) => JSON.parse(JSON.stringify(o));

function buildDays(start, end, hours, sat) {
  const out = []; const d = new Date(start + "T00:00"); const e = new Date(end + "T00:00");
  while (d <= e && out.length < 250) { const g = d.getDay(); if (g !== 0 && (sat || g !== 6)) out.push({ date: iso(d), hours }); d.setDate(d.getDate() + 1); }
  return out;
}
const phase = (p) => (TODAY < p.start ? "soon" : TODAY > p.end ? "done" : "now");
const PHASE = { soon: ["Скоро", "st-info"], now: ["Идёт", "st-ok"], done: ["Завершена", "st-draft"] };
const orgOf = (p, sid) => p.orgs.find((o) => o.studentIds.includes(sid));
const masterOf = (db, p) => db.masters.find((m) => m.id === p.masterId) || { name: "—", phone: "" };
function stats(db, p, sid) {
  const E = db.entries[p.id]?.[sid] || {}; let ok = 0, sent = 0, back = 0;
  p.days.forEach((d) => { const s = E[d.date]?.status; if (s === "ok") ok++; else if (s === "sent") sent++; else if (s === "back") back++; });
  return { E, ok, sent, back, total: p.days.length };
}

/* =================== хранилище =================== */
const KEY = "pl3-practice-v3";
function loadDb() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return seed(); }
function saveDb(db) { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn("Не удалось сохранить", e); } }

/* фото и видео — в IndexedDB браузера */
const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("pl3-practice-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("m");
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(id, blob) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("m", "readwrite"); t.objectStore("m").put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(id) { const db = await this.open(); return new Promise((res) => { const q = db.transaction("m").objectStore("m").get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async del(id) { const db = await this.open(); db.transaction("m", "readwrite").objectStore("m").delete(id); },
};
function compressImage(file, max = 1280) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); res(b || file); }, "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

/* =================== импорт с pl3service =================== */
async function api(settings, path) {
  const url = settings.apiBase.replace(/\/$/, "") + path;
  const headers = settings.token ? { Authorization: "Bearer " + settings.token } : {};
  let r;
  try { r = await fetch(url, { headers: { Accept: "application/json", ...headers }, credentials: "include" }); }
  catch (e) { throw new Error(`Не удалось подключиться к ${url || "pl3service"}. Откройте эту страницу с сайта pl3service: ${location.protocol.startsWith("http") ? "" : "файл, открытый с компьютера, не может войти в pl3service."}`); }
  const login = (r.redirected && /\/login/.test(r.url)) || (r.headers.get("content-type") || "").includes("text/html");
  if (login || r.status === 401) throw new Error("Сессия pl3service не найдена — войдите на pl3service под своим логином и обновите страницу.");
  if (r.status === 403) throw new Error("Нет доступа к этой группе в pl3service.");
  if (!r.ok) throw new Error(`pl3service ответил кодом ${r.status} на ${url}.`);
  return r.json();
}
/* курс по названию группы: «ЭМ-24», «ЭМ-2-24», «ЭМ 24-1» → год набора 2024 */
function guessCourse(name) {
  const m = String(name).match(/(?:^|\D)(2\d)(?:\D|$)/); if (!m) return 0;
  const now = new Date(); const startYY = (now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1) % 100;
  const c = startYY - Number(m[1]) + 1; return c >= 1 && c <= 3 ? c : 0;
}
async function fetchMe() {
  if (!ON_PL3) return null;
  try { const r = await fetch("/api/admin/me", { credentials: "include", headers: { Accept: "application/json" } }); if (!r.ok || (r.headers.get("content-type") || "").includes("text/html")) return null; return await r.json(); }
  catch (e) { return null; }
}
const asArray = (j) => (Array.isArray(j) ? j : j?.data || j?.groups || j?.students || j?.items || j?.result || []);
const normGroup = (g) => typeof g === "string" ? { key: g, name: g, profession: "", course: "" } : {
  key: g._id || g.id || g.name, name: g.name || g.title || g.groupName || g.group || String(g._id || g.id),
  profession: g.profRu || g.profession || g.specialty || g.speciality || "", course: g.course || g.kurs || guessCourse(g.name) || "",
  students: Array.isArray(g.students) ? g.students : null,
};
const normStudent = (s) => typeof s === "string" ? { extId: "", name: s.trim() } : {
  extId: String(s._id || s.id || ""),
  name: (s.fullName || s.fio || s.full_name || s.FIO || s.name || [s.lastName || s.surname, s.firstName, s.middleName || s.patronymic].filter(Boolean).join(" ")).trim(),
};
async function fetchGroups(settings) { return asArray(await api(settings, settings.groupsPath)).map(normGroup).filter((g) => g.name); }
async function fetchStudents(settings, g) {
  if (g.students?.length && typeof g.students[0] === "object") return g.students.map(normStudent).filter((s) => s.name);
  const path = settings.studentsPath.replace("{group}", encodeURIComponent(g.key)).replace("{groupName}", encodeURIComponent(g.name));
  return asArray(await api(settings, path)).map(normStudent).filter((s) => s.name);
}
function parsePasted(text) {
  const t = text.trim(); if (!t) return [];
  if (t[0] === "[" || t[0] === "{") { try { return asArray(JSON.parse(t)).map(normStudent).filter((s) => s.name); } catch (e) {} }
  return t.split("\n").map((x) => x.replace(/^\s*\d+[.)]\s*/, "").trim()).filter(Boolean).map((name) => ({ extId: "", name }));
}

/* =================== печать и Word =================== */
const DOC_CSS_PRINT = () => [...document.styleSheets].map((ss) => { try { return [...ss.cssRules].map((r) => r.cssText).filter((t) => t.startsWith(".doc") || t.startsWith(":root")).join("\n"); } catch (e) { return ""; } }).join("\n");
const fullHTML = (body, title) => `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:16mm 15mm}body{margin:0}
${DOC_CSS_PRINT()}
.doc{font-family:'Times New Roman',serif;font-size:12pt}.doc td,.doc th{font-size:11pt}.page{page-break-after:always}.page:last-child{page-break-after:auto}</style></head><body class="doc">${body}</body></html>`;
function printDoc(body, title) {
  const f = document.createElement("iframe");
  Object.assign(f.style, { position: "fixed", right: 0, bottom: 0, width: 0, height: 0, border: 0 });
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(fullHTML(body, title)); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) {} setTimeout(() => f.remove(), 2000); }, 350);
}
function downloadDoc(body, title) {
  const blob = new Blob(["﻿" + fullHTML(body, title)], { type: "application/msword" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = title.replace(/[\\/:*?"<>|]/g, "_") + ".doc"; document.body.appendChild(a); a.click(); a.remove();
}

    <div className="card tbl" style=${{ padding: 0 }}>

function MasterProfile({ m, mutate }) {

  useEffect(() => setF({ name: m.name, phone: m.phone }), [m.id]);
  const incomplete = !m.phone || m.name.split(/\s+/).length < 2;
  return html`<div className=${"card tight" + (incomplete ? "" : "")} style=${{ background: incomplete ? "var(--warn-bg)" : "var(--card)" }}>
    ${incomplete && html`<div className="small" style=${{ marginBottom: 8 }}>Заполните ФИО и телефон — они печатаются в договоре как ответственный от лицея.</div>`}
    <div className="row" style=${{ alignItems: "flex-end" }}>
      <div style=${{ flex: "2 1 220px" }}><${Field} label="ФИО мастера п/о"><input id="mName" value=${f.name} onInput=${(e) => { setF({ ...f, name: e.target.value }); setSaved(false); }} /><//></div>
      <div style=${{ flex: "1 1 150px" }}><${Field} label="Телефон"><input id="mPhone" value=${f.phone} onInput=${(e) => { setF({ ...f, phone: e.target.value }); setSaved(false); }} placeholder="0700 00-00-00" /><//></div>
      <${Btn} sm kind="ghost" onClick=${() => { mutate((n) => Object.assign(n.masters.find((x) => x.id === m.id), f)); setSaved(true); }}>${saved ? "Сохранено" : "Сохранить"}<//>

}

function NewPractice({ db, mutate, mid, onDone, openSettings }) {
  const [groups, setGroups] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [gKey, setGKey] = useState("");
  const [students, setStudents] = useState([]);
  const [manual, setManual] = useState(false);
  const [paste, setPaste] = useState("");
  const [f, setF] = useState({ group: "", course: 1, hours: 6, profession: "", start: "", end: "", sat: true });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });

  const loadGroups = async () => { setBusy(true); setErr(""); try { const g = await fetchGroups(db.settings); setGroups(g); if (!g.length) setErr("pl3service вернул пустой список групп."); } catch (e) { setErr(e.message); } setBusy(false); };
  const pickGroup = async (key) => {
    setGKey(key); const g = groups.find((x) => String(x.key) === String(key)); if (!g) return;
    const course = Number(g.course) || (/-(\d)-/.exec(g.name)?.[1] ? 1 : f.course);
    setF((x) => ({ ...x, group: g.name, profession: g.profession || x.profession, course: Number(g.course) || x.course, hours: (Number(g.course) || x.course) >= 2 ? 8 : 6 }));
    setBusy(true); setErr("");
    try { setStudents((await fetchStudents(db.settings, g)).map((s) => ({ ...s, on: true }))); } catch (e) { setErr(e.message); setStudents([]); }
    setBusy(false);
  };
  const applyPaste = () => { const s = parsePasted(paste); setStudents(s.map((x) => ({ ...x, on: true }))); if (!s.length) setErr("Не нашёл ФИО: вставьте по одному на строку или JSON из pl3service."); else setErr(""); };
  const create = () => {
    const chosen = students.filter((s) => s.on);
    if (!f.group || !f.start || !f.end) return setErr("Укажите группу и даты практики.");
    if (f.end < f.start) return setErr("Дата окончания раньше даты начала.");
    if (!chosen.length) return setErr("В списке нет ни одного студента.");
    mutate((n) => n.practices.unshift({
      id: uid(), group: f.group, course: Number(f.course), profession: f.profession || "—", start: f.start, end: f.end, sat: f.sat,
      days: buildDays(f.start, f.end, Number(f.hours), f.sat), masterId: mid, source: manual ? "вручную" : "pl3service",
      students: chosen.map((s) => ({ id: uid(), extId: s.extId, name: s.name })), orgs: [],
    }));
    onDone();
  };

  return html`<div className="card stack">
    <h3>1. Группа и студенты</h3>
    ${!manual ? html`<div className="stack" style=${{ gap: 8 }}>
      <div className="row"><${Btn} kind="ghost" disabled=${busy} onClick=${loadGroups}>${busy && !groups.length ? "Загружаю…" : "Загрузить группы с pl3service"}<//>
        ${groups.length > 0 && html`<select id="grpSel" style=${{ width: "auto", minWidth: 180 }} value=${gKey} onChange=${(e) => pickGroup(e.target.value)}><option value="">Выберите группу</option>${groups.map((g) => html`<option key=${g.key} value=${g.key}>${g.name}</option>`)}</select>`}
        <button className="linkbtn small" onClick=${openSettings}>Настройки подключения</button></div>
      <button className="linkbtn small" onClick=${() => { setManual(true); setErr(""); }}>Сайт недоступен? Вставить список вручную</button></div>`
    : html`<div className="stack" style=${{ gap: 8 }}>
      <div className="grid2"><${Field} label="Группа"><input id="grpManual" value=${f.group} onInput=${set("group")} placeholder="ЭМ-1-25" /><//></div>
      <${Field} label="ФИО по одному на строку, или JSON со студентами из pl3service"><textarea id="paste" rows="5" value=${paste} onInput=${(e) => setPaste(e.target.value)}></textarea><//>
      <div className="row"><${Btn} sm kind="ghost" onClick=${applyPaste}>Разобрать список<//><button className="linkbtn small" onClick=${() => setManual(false)}>Вернуться к загрузке с pl3service</button></div></div>`}
    ${err && html`<div className="alert bad">${err}</div>`}
    ${students.length > 0 && html`<div className="card tight" style=${{ background: "#FAFBFD" }}>
      <div className="small muted" style=${{ marginBottom: 6 }}>Студентов: ${students.filter((s) => s.on).length} из ${students.length}. Снимите отметку с тех, кто не идёт на практику.</div>
      <div className="grid2" style=${{ gap: 4 }}>${students.map((s, i) => html`<label key=${i} className="row small" style=${{ flexWrap: "nowrap" }}><input type="checkbox" checked=${s.on} onChange=${() => setStudents(students.map((x, j) => (j === i ? { ...x, on: !x.on } : x)))} />${s.name}</label>`)}</div></div>`}
    <h3>2. Сроки и часы</h3>
    <div className="grid3">
      <${Field} label="Курс"><select id="course" value=${f.course} onChange=${(e) => setF({ ...f, course: e.target.value, hours: e.target.value === "1" ? 6 : 8 })}><option value="1">1 курс</option><option value="2">2 курс</option><option value="3">3 курс</option></select><//>
      <${Field} label="Часов в день"><input id="hours" type="number" min="1" max="12" value=${f.hours} onInput=${set("hours")} /><//>
      <${Field} label="Профессия"><input id="prof" value=${f.profession} onInput=${set("profession")} /><//>
      <${Field} label="Начало"><input id="start" type="date" value=${f.start} onInput=${set("start")} /><//>
      <${Field} label="Окончание"><input id="end" type="date" value=${f.end} onInput=${set("end")} /><//>
      <label className="row small" style=${{ alignSelf: "end", paddingBottom: 8 }}><input type="checkbox" checked=${f.sat} onChange=${set("sat")} /> Суббота — рабочий день</label>
    </div>
    <p className="small muted" style=${{ margin: 0 }}>Организации и распределение студентов — на следующем шаге, в карточке группы.</p>
    <div><${Btn} onClick=${create}>Создать практику<//></div>
  </div>`;
}

function PracticeManage({ db, p, mutate, setDoc }) {
  const [tab, setTab] = useState("dist");
  const [editing, setEditing] = useState(null);
  const [linkFor, setLinkFor] = useState(null);
  const m = masterOf(db, p);
  const upd = (fn) => mutate((n) => fn(n.practices.find((x) => x.id === p.id)));
  const assign = (sid, oid) => upd((x) => { x.orgs.forEach((o) => (o.studentIds = o.studentIds.filter((i) => i !== sid))); if (oid) x.orgs.find((o) => o.id === oid).studentIds.push(sid); });
  const saveOrg = (data) => { upd((x) => { if (editing === "new") x.orgs.push({ id: uid(), code: code4(), contract: "draft", studentIds: [], ...data }); else Object.assign(x.orgs.find((o) => o.id === editing), data); }); setEditing(null); };
  const openContract = (o) => setDoc({ title: `Договор ${p.group} — ${o.name}`, html: contractHTML(p, o, m), onPrint: () => o.contract === "draft" && upd((x) => (x.orgs.find((y) => y.id === o.id).contract = "printed")) });
  const un = p.students.filter((s) => !orgOf(p, s.id));

  return html`<div className="card stack">
    <div className="row between"><div><h3 style=${{ fontSize: 18 }}>${p.group} <${Chip} map=${PHASE} k=${phase(p)} /></h3>
      <div className="small muted">${p.course} курс, ${p.profession}. ${fmt(p.start)}–${fmt(p.end)}, ${p.days.length} дн., ${sumHours(p)} ч. Список: ${p.source}.</div></div>
      <div className="tabs">${[["dist", "Распределение"], ["hours", "Часы по дням"]].map(([k, t]) => html`<button key=${k} aria-selected=${tab === k} onClick=${() => setTab(k)}>${t}</button>`)}</div></div>

    ${tab === "hours" ? html`<${HoursEditor} p=${p} upd=${upd} />` : html`<div className="stack">
      ${p.orgs.map((o) => editing === o.id ? html`<${OrgForm} key=${o.id} init=${o} p=${p} onSave=${saveOrg} onCancel=${() => setEditing(null)} />` : html`<div key=${o.id} className="card tight">
        <div className="row between" style=${{ alignItems: "flex-start" }}>
          <div style=${{ minWidth: 0 }}><b>${o.name}</b><div className="small muted">${o.address}. Руководитель: ${o.supName}, ${o.supPos}, ${o.supPhone}</div></div>
          <select id=${"ct-" + o.id} style=${{ width: "auto" }} value=${o.contract} onChange=${(e) => upd((x) => (x.orgs.find((y) => y.id === o.id).contract = e.target.value))} aria-label="Статус договора">
            ${Object.entries(CONTRACT).map(([k, [t]]) => html`<option key=${k} value=${k}>${t}</option>`)}</select></div>
        <div className="row" style=${{ marginTop: 8 }}>${p.students.filter((s) => o.studentIds.includes(s.id)).map((s) => html`<span key=${s.id} className="chip st-info">${short(s.name)}</span>`)}
          ${!o.studentIds.length && html`<span className="small muted">Студенты ещё не назначены</span>`}</div>
        <div className="row" style=${{ marginTop: 10 }}>
          <${Btn} sm disabled=${!o.studentIds.length} onClick=${() => openContract(o)}>Договор, 2 экз.<//>
          <${Btn} sm kind="ghost" onClick=${() => setLinkFor(linkFor === o.id ? null : o.id)}>Ссылка руководителю<//>
          <${Btn} sm kind="ghost" onClick=${() => setEditing(o.id)}>Изменить<//>
          ${!o.studentIds.length && html`<${Btn} sm kind="warn" onClick=${() => upd((x) => (x.orgs = x.orgs.filter((y) => y.id !== o.id)))}>Удалить<//>`}</div>
        ${linkFor === o.id && html`<div className="note" style=${{ marginTop: 10 }}>Отправьте руководителю в WhatsApp: <b>pl3service.onrender.com/practice/${p.id}-${o.code}</b><br /><span className="small muted">Вход без пароля. В прототипе — вкладка «Руководитель практики», код ${o.code}.</span></div>`}
      </div>`)}
      ${editing === "new" ? html`<${OrgForm} init=${{}} p=${p} onSave=${saveOrg} onCancel=${() => setEditing(null)} />` : html`<div><${Btn} kind="ghost" onClick=${() => setEditing("new")}>Добавить организацию<//></div>`}

      <div className="tbl"><table className="list"><thead><tr><th>Студент</th><th>Организация</th><th>Дневник</th></tr></thead><tbody>
        ${p.students.map((s) => { const o = orgOf(p, s.id); const st = stats(db, p, s.id);
          return html`<tr key=${s.id}><td><button className="linkbtn" onClick=${() => setDoc({ title: `Дневник — ${short(s.name)}`, html: diaryHTML(p, s, o, m, st.E) })}>${s.name}</button></td>
            <td style=${{ minWidth: 190 }}><select id=${"as-" + s.id} value=${o?.id || ""} onChange=${(e) => assign(s.id, e.target.value)} aria-label=${"Организация для " + s.name}>
              <option value="">— не распределён —</option>${p.orgs.map((x) => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select></td>
            <td style=${{ minWidth: 130 }}><${Progress} v=${st.ok} t=${st.total} /></td></tr>`; })}
      </tbody></table></div>
      ${un.length > 0 && p.orgs.length > 0 && html`<div className="alert">Не распределено: ${un.length}. Договор формируется по организации — в него попадут только назначенные студенты.</div>`}
    </div>`}
  </div>`;
}

/* =================== СТУДЕНТ =================== */
function DayRow({ d, e, onSave }) {
  const [text, setText] = useState(e?.text || "");
  const [busy, setBusy] = useState(false);
  useEffect(() => setText(e?.text || ""), [e?.text]);
  const future = d.date > TODAY;
  const st = future ? "future" : e?.status || "draft";
  const locked = st === "ok" || st === "sent" || future;
  const media = e?.media || [];
  const addFiles = async (files) => {
    setBusy(true); const add = [];
    for (const f of files) {
      const isVid = f.type.startsWith("video"); if (!isVid && !f.type.startsWith("image")) continue;
      if (isVid && f.size > 60e6) { alert("Видео больше 60 МБ — обрежьте или снимите короче."); continue; }
      const blob = isVid ? f : await compressImage(f); const id = uid();
      await idb.put(id, blob); add.push({ id, type: isVid ? "video" : "image", name: f.name });
    }
    onSave({ media: [...media, ...add] }); setBusy(false);
  };
  return html`<div className="card tight">
    <div className="row between"><b className="num">${fmt(d.date)} <span className="muted" style=${{ fontWeight: 400 }}>${wd(d.date)}, ${d.hours} ч</span></b><${Chip} map=${STATUS} k=${st} extra=${st === "ok" && e?.grade ? ", оценка " + e.grade : ""} /></div>
    ${st === "back" && e?.comment && html`<div className="alert bad" style=${{ marginTop: 8 }}>Руководитель: ${e.comment}</div>`}
    ${locked ? (e?.text && html`<p style=${{ margin: "8px 0 0", whiteSpace: "pre-wrap" }}>${e.text}</p>`) : html`
      <textarea id=${"t-" + d.date} rows="2" style=${{ marginTop: 8 }} value=${text} onInput=${(x) => setText(x.target.value)} placeholder="Что выполняли в этот день"></textarea>`}
    ${(media.length > 0 || !locked) && html`<div className="media">${media.map((m) => html`<${MediaThumb} key=${m.id} m=${m} onRemove=${locked ? null : () => { idb.del(m.id); onSave({ media: media.filter((x) => x.id !== m.id) }); }} />`)}</div>`}
    ${!locked && html`<div className="row" style=${{ marginTop: 8 }}>
      <label className="upl"><input type="file" accept="image/*,video/*" multiple onChange=${(x) => { addFiles([...x.target.files]); x.target.value = ""; }} />${busy ? "Загружаю…" : "Фото или видео (необязательно)"}</label>
      <span style=${{ flex: 1 }}></span>
      <${Btn} sm kind="ghost" onClick=${() => onSave({ text, status: st === "back" ? "back" : "draft" })}>Сохранить<//>
      <${Btn} sm disabled=${!text.trim()} onClick=${() => onSave({ text, status: "sent", comment: "" })}>Отправить руководителю<//></div>`}
  </div>`;
}

function StudentView({ db, mutate, setDoc }) {
  const [pid, setPid] = useState(db.practices[0]?.id);
  const p = db.practices.find((x) => x.id === pid) || db.practices[0];
  const [sid, setSid] = useState(p?.students[0]?.id);
  if (!p) return html`<div className="card">Практик пока нет.</div>`;
  const s = p.students.find((x) => x.id === sid) || p.students[0];
  const o = orgOf(p, s.id); const m = masterOf(db, p); const st = stats(db, p, s.id); const ch = db.chars[p.id]?.[s.id];
  const ready = st.ok === st.total && ch?.done;
  const save = (date, patch) => mutate((n) => { n.entries[p.id] ??= {}; n.entries[p.id][s.id] ??= {}; n.entries[p.id][s.id][date] = { ...(n.entries[p.id][s.id][date] || {}), ...patch }; });
  return html`<div className="stack">
    <div className="grid2">
      <${Field} label="Группа"><select id="stP" value=${p.id} onChange=${(e) => { setPid(e.target.value); setSid(db.practices.find((x) => x.id === e.target.value)?.students[0]?.id); }}>${db.practices.map((x) => html`<option key=${x.id} value=${x.id}>${x.group}</option>`)}</select><//>
      <${Field} label="Вы вошли как"><select id="stS" value=${s.id} onChange=${(e) => setSid(e.target.value)}>${p.students.map((x) => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
    </div>
    ${!o ? html`<div className="alert">Мастер п/о ещё не направил вас в организацию. Дневник откроется после распределения.</div>` : html`
    <div className="card stack" style=${{ gap: 10 }}>
      <div><b>${o.name}</b><div className="small muted">${o.address}. Руководитель практики: ${o.supName}, ${o.supPos}, ${o.supPhone}. Мастер п/о: ${m.name}.</div></div>
      <${Progress} v=${st.ok} t=${st.total} />
      <div className="row">
        <${Btn} sm kind="ghost" onClick=${() => setDoc({ title: `Дневник — ${short(s.name)}`, html: diaryHTML(p, s, o, m, st.E) })}>Дневник<//>
        <${Btn} sm kind="ghost" disabled=${!ch?.done} onClick=${() => setDoc({ title: `Характеристика — ${short(s.name)}`, html: charHTML(p, s, o, ch) })}>Характеристика<//>
        <${Btn} sm kind="ok" disabled=${!ready} onClick=${() => setDoc({ title: `Документы практики — ${short(s.name)}`, html: diaryHTML(p, s, o, m, st.E) + charHTML(p, s, o, ch) })}>Распечатать дневник и характеристику<//></div>
      ${!ready && html`<div className="small muted">Печать откроется, когда все дни подтверждены (${st.ok}/${st.total}) и руководитель заполнил характеристику${ch?.done ? " — готово" : ""}.</div>`}
    </div>
    <div className="stack" style=${{ gap: 8 }}>${p.days.map((d) => html`<${DayRow} key=${d.date} d=${d} e=${st.E[d.date]} onSave=${(patch) => save(d.date, patch)} />`)}</div>`}
  </div>`;
}

/* =================== РУКОВОДИТЕЛЬ ПРАКТИКИ =================== */
function ReviewRow({ d, e, onDecide }) {
  const [grade, setGrade] = useState(5);
  const [comment, setComment] = useState("");
  return html`<div className="card tight">
    <b className="num">${fmt(d.date)} <span className="muted" style=${{ fontWeight: 400 }}>${wd(d.date)}, ${d.hours} ч</span></b>
    <p style=${{ margin: "6px 0", whiteSpace: "pre-wrap" }}>${e.text}</p>
    ${e.media?.length > 0 && html`<div className="media">${e.media.map((m) => html`<${MediaThumb} key=${m.id} m=${m} big />`)}</div>`}
    <div className="row" style=${{ marginTop: 8 }}><span className="small muted">Оценка</span><${Grades} value=${grade} onChange=${setGrade} /><${Btn} sm kind="ok" onClick=${() => onDecide({ status: "ok", grade })}>Подтвердить<//></div>
    <div className="row" style=${{ marginTop: 8, flexWrap: "nowrap" }}><input id=${"c-" + d.date} value=${comment} placeholder="Замечание, если нужно вернуть" onInput=${(x) => setComment(x.target.value)} />
      <${Btn} sm kind="warn" disabled=${!comment.trim()} onClick=${() => onDecide({ status: "back", comment, grade: null })}>Вернуть<//></div>
  </div>`;
}

function CharForm({ p, s, o, ch, onSave, setDoc, avg }) {
  const init = () => ({ disc: 5, skill: 5, tb: 5, q: [], works: "", extra: "", rank: p.course >= 2 ? "3-го" : "2-го", grade: Math.round(avg) || 5, ...ch });
  const [c, setC] = useState(init);
  useEffect(() => setC(init()), [s.id]);
  const lvl = (k, label) => html`<div className="row"><span className="small" style=${{ width: 210 }}>${label}</span><${Grades} list=${[5, 4, 3]} value=${c[k]} onChange=${(v) => setC({ ...c, [k]: v })} /></div>`;
  return html`<div className="stack" style=${{ gap: 12 }}>
    <p className="small muted" style=${{ margin: 0 }}>Отметьте уровень по каждому пункту — текст характеристики соберётся сам. Средняя оценка по дневнику: ${avg ? avg.toFixed(1) : "—"}.</p>
    ${lvl("disc", "Отношение к работе, дисциплина")}${lvl("skill", "Профессиональные умения")}${lvl("tb", "Техника безопасности")}
    <div><div className="small muted" style=${{ marginBottom: 6 }}>Личные качества</div><div className="row">${CH.qual.map((x) => html`<button key=${x} className="pill" aria-pressed=${c.q.includes(x)} onClick=${() => setC({ ...c, q: c.q.includes(x) ? c.q.filter((y) => y !== x) : [...c.q, x] })}>${x}</button>`)}</div></div>
    <${Field} label="Какие работы освоил (необязательно)"><input id="works" value=${c.works} onInput=${(e) => setC({ ...c, works: e.target.value })} placeholder="Монтаж щитов освещения, ревизия электродвигателей" /><//>
    <${Field} label="Дополнительно (необязательно)"><textarea id="extra" rows="2" value=${c.extra} onInput=${(e) => setC({ ...c, extra: e.target.value })}></textarea><//>
    <div className="grid2"><${Field} label="Рекомендуемый разряд"><select id="rank" value=${c.rank} onChange=${(e) => setC({ ...c, rank: e.target.value })}><option value="">не указывать</option>${["2-го", "3-го", "4-го"].map((r) => html`<option key=${r} value=${r}>${r}</option>`)}</select><//>
      <div><div className="small muted" style=${{ marginBottom: 4 }}>Оценка за практику</div><${Grades} value=${c.grade} onChange=${(v) => setC({ ...c, grade: v })} /></div></div>
    <div className="row"><${Btn} kind="ok" onClick=${() => onSave({ ...c, done: true })}>Сохранить характеристику<//><${Btn} kind="ghost" onClick=${() => setDoc({ title: `Характеристика — ${short(s.name)}`, html: charHTML(p, s, o, c) })}>Предпросмотр<//></div>
    ${ch?.done && html`<span className="chip st-ok" style=${{ alignSelf: "flex-start" }}>Сохранено — учащийся может распечатать</span>`}
  </div>`;
}

function SupervisorView({ db, mutate, setDoc }) {
  const opts = db.practices.flatMap((p) => p.orgs.map((o) => ({ p, o })));
  const [key, setKey] = useState(opts[0] ? opts[0].p.id + "|" + opts[0].o.id : "");
  const [sid, setSid] = useState(null);
  const [tab, setTab] = useState("diary");
  const cur = opts.find((x) => x.p.id + "|" + x.o.id === key) || opts[0];
  if (!cur) return html`<div className="card">Организаций пока нет — мастер п/о добавит их при распределении.</div>`;
  const { p, o } = cur;
  const list = p.students.filter((s) => o.studentIds.includes(s.id));
  const s = list.find((x) => x.id === sid);
  const decide = (studentId, date, patch) => mutate((n) => Object.assign(n.entries[p.id][studentId][date], patch));
  const saveChar = (studentId, data) => mutate((n) => { n.chars[p.id] ??= {}; n.chars[p.id][studentId] = data; });
  return html`<div className="stack">
    <${Field} label="Вход по ссылке (в прототипе — выбор)"><select id="supSel" value=${key} onChange=${(e) => { setKey(e.target.value); setSid(null); }}>${opts.map(({ p, o }) => html`<option key=${p.id + o.id} value=${p.id + "|" + o.id}>${o.supName} — ${o.name}, ${p.group} (код ${o.code})</option>`)}</select><//>
    <div className="note">Здравствуйте, ${o.supName}. У вас на практике ${list.length} учащ. группы ${p.group}, ${fmt(p.start)}–${fmt(p.end)}. Мастер п/о: ${masterOf(db, p).name}, ${masterOf(db, p).phone}.</div>
    <div className="card" style=${{ padding: 0 }}>${list.map((x, i) => { const st = stats(db, p, x.id); const ch = db.chars[p.id]?.[x.id];
      return html`<button key=${x.id} onClick=${() => setSid(x.id === sid ? null : x.id)} className="row" style=${{ width: "100%", border: 0, borderTop: i ? "1px solid var(--line)" : 0, padding: "12px 16px", background: x.id === sid ? "#F2F5FC" : "transparent", cursor: "pointer", font: "inherit", color: "inherit", textAlign: "left", flexWrap: "nowrap" }}>
        <span style=${{ flex: 1, fontWeight: 500 }}>${x.name}</span>
        ${st.sent > 0 && html`<span className="chip st-sent">${st.sent} на проверке</span>`}
        ${ch?.done && html`<span className="chip st-ok">характеристика</span>`}
        <span className="small muted num">${st.ok}/${st.total}</span></button>`; })}</div>
    ${s && html`<div className="card stack">
      <div className="row between"><h3>${s.name}</h3><div className="tabs">${[["diary", "Дневник"], ["char", "Характеристика"]].map(([k, t]) => html`<button key=${k} aria-selected=${tab === k} onClick=${() => setTab(k)}>${t}</button>`)}</div></div>
      ${tab === "diary" ? (() => { const st = stats(db, p, s.id); const pend = p.days.filter((d) => st.E[d.date]?.status === "sent");
        return pend.length ? html`<div className="stack" style=${{ gap: 8 }}>${pend.map((d) => html`<${ReviewRow} key=${d.date} d=${d} e=${st.E[d.date]} onDecide=${(patch) => decide(s.id, d.date, patch)} />`)}</div>`
          : html`<p className="muted" style=${{ margin: 0 }}>Новых записей нет. Подтверждено дней: ${st.ok} из ${st.total}.</p>`; })()
        : (() => { const st = stats(db, p, s.id); const g = Object.values(st.E).filter((e) => e.status === "ok" && e.grade).map((e) => e.grade);
          return html`<${CharForm} p=${p} s=${s} o=${o} ch=${db.chars[p.id]?.[s.id]} avg=${g.length ? g.reduce((a, b) => a + b, 0) / g.length : 0} onSave=${(d) => saveChar(s.id, d)} setDoc=${setDoc} />`; })()}
    </div>`}
  </div>`;
}

/* =================== приложение =================== */
const ROLES = [["senior", "Старший мастер"], ["master", "Мастер п/о"], ["student", "Студент"], ["sup", "Руководитель практики"]];
function App() {
  const [db, setDb] = useState(loadDb);
  const [role, setRole] = useState(() => { try { return localStorage.getItem(KEY + "-role") || "senior"; } catch (e) { return "senior"; } });
  const [doc, setDoc] = useState(null);
  const [settings, setSettings] = useState(false);
  const [me, setMe] = useState(null);
  const mutate = (fn) => setDb((cur) => { const n = clone(cur); fn(n); saveDb(n); return n; });
  const pick = (r) => { setRole(r); try { localStorage.setItem(KEY + "-role", r); } catch (e) {} };
  useEffect(() => { fetchMe().then((m) => {
    if (!m?.role) return; setMe(m);
    if (m.role === "curator") {
      mutate((n) => { if (!n.masters.some((x) => x.id === "cur:" + m.username)) n.masters.push({ id: "cur:" + m.username, name: m.username, phone: "" }); });
      pick("master");
    } else if (m.role === "admin") pick("senior");
  }); }, []);
  return html`<${React.Fragment}>
    <header className="top"><div className="wrap">
      <div className="brand">Производственная практика ПЛ №3</div>
      <div className="tabs" role="tablist">${ROLES.map(([k, t]) => html`<button key=${k} role="tab" aria-selected=${role === k} onClick=${() => pick(k)}>${t}</button>`)}</div>
      <div className="row small">${me && html`<span className="muted">${me.role === "admin" ? "Администратор" : "Куратор"}: ${me.username}</span><span className="muted">·</span>`}<button className="linkbtn" onClick=${() => setSettings(true)}>pl3service</button><span className="muted">·</span><button className="linkbtn" onClick=${() => { const n = seed(); saveDb(n); setDb(n); }}>Сбросить демо</button></div>
    </div></header>
    <main className="wrap">
      ${role === "senior" ? html`<${SeniorView} db=${db} setDoc=${setDoc} />`
        : role === "master" ? html`<${MasterView} db=${db} mutate=${mutate} setDoc=${setDoc} me=${me} openSettings=${() => setSettings(true)} />`
        : role === "student" ? html`<${StudentView} db=${db} mutate=${mutate} setDoc=${setDoc} />`
        : html`<${SupervisorView} db=${db} mutate=${mutate} setDoc=${setDoc} />`}
    </main>
    ${doc && html`<${DocModal} doc=${doc} onClose=${() => setDoc(null)} />`}
    ${settings && html`<${SettingsModal} db=${db} mutate=${mutate} onClose=${() => setSettings(false)} />`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
