<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практика ПЛ №3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1F3A93; --ink-soft:#E8EDF9; --text:#262A33; --muted:#667085; --line:#DCE2EC;
  --bg:#F2F4F8; --card:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn:#8A5A12; --warn-bg:#FBF0DC; --bad:#B42318; --bad-bg:#FBE9E7;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font-weight:600;color:var(--ink);font-size:17px;margin-right:auto}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:#EBEEF4;border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font:500 14px var(--sans);color:#4F5869;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.15)}
main{padding-block:20px 60px}
h2{font-size:20px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.tight{padding:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:680px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:block;font-size:13px}
label.f>span{display:block;margin-bottom:4px;color:var(--muted)}
input,select,textarea{width:100%;font:14px var(--sans);color:var(--text);background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
:focus-visible{outline:2px solid #8FA8E8;outline-offset:1px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;font:500 14px var(--sans);padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.warn{background:#fff;color:var(--bad);border-color:#EBC0BA}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-draft{color:#5B6475;background:#EEF0F3}.st-sent{color:var(--warn);background:var(--warn-bg)}
.st-ok{color:var(--ok);background:var(--ok-bg)}.st-back{color:var(--bad);background:var(--bad-bg)}
.st-info{color:var(--ink);background:var(--ink-soft)}
.bar{height:7px;border-radius:9px;background:#E4E8F0;flex:1;min-width:60px}
.bar>i{display:block;height:7px;border-radius:9px;background:var(--ink)}
.bar.full>i{background:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.stat .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:8px;border-bottom:1px solid #EEF1F5;vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#F7F9FC}
.alert{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:6px;font-size:14px}
.alert.bad{border-color:var(--bad);background:var(--bad-bg)}
.alert.good{border-color:var(--ok);background:var(--ok-bg)}
.note{background:var(--ink-soft);padding:10px 12px;border-radius:8px;font-size:14px}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#F1F3F8;border-radius:5px;padding:1px 5px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1E2433;color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;z-index:99;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.icon-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.icon-x:hover{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><p class="wrap" style="padding-block:20px">Загрузка…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useCallback } = React;

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const o = { credentials: "include", headers: { Accept: "application/json" }, ...opts };
  if (opts.body && !(opts.body instanceof FormData)) { o.body = JSON.stringify(opts.body); o.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, o);
  if (r.status === 401) { location.href = "/login"; throw new Error("Войдите в систему"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Ошибка ${r.status}`);
  return j;
}
async function download(path) {
  const r = await fetch(path, { credentials: "include" });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `Ошибка ${r.status}`); }
  const cd = r.headers.get("Content-Disposition") || "";
  const m = /filename\*=UTF-8''([^;]+)/.exec(cd);
  const name = m ? decodeURIComponent(m[1]) : "document.docx";
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
let toastTimer;
function toast(text, err) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.className = "toast" + (err ? " err" : ""); el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), err ? 5000 : 2500);
}
const run = (fn, okText) => async (...a) => { try { const r = await fn(...a); if (okText) toast(okText); return r; } catch (e) { toast(e.message, true); } };
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано"); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("Скопировано"); } catch (e2) { toast("Не удалось скопировать — выделите вручную", true); } t.remove(); }
}

/* ---------- утилиты ---------- */
const fmt = (d) => { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${dd}.${m}.${y}`; };
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const wd = (d) => WD[new Date(d + "T00:00").getDay()];
const short = (fio = "") => { const [f, i, o] = fio.trim().split(/\s+/); return `${f || ""} ${i ? i[0] + "." : ""}${o ? o[0] + "." : ""}`.trim(); };
let TODAY = new Date().toISOString().slice(0, 10);
const phase = (p) => (TODAY < p.start ? "soon" : TODAY > p.end ? "done" : "now");
const PHASE = { soon: ["Скоро", "st-info"], now: ["Идёт", "st-ok"], done: ["Завершена", "st-draft"] };
const CONTRACT = { draft: ["Не распечатан", "st-draft"], printed: ["На подписи", "st-sent"], returned: ["Сдан в лицей", "st-ok"] };
const orgOf = (p, s) => p.orgs.find((o) => String(o._id) === String(s.org));
const link = (kind, t) => `${location.origin}/p/${kind}/${t}`;
function guessCourse(name) {
  const m = String(name).match(/(?:^|\D)(2\d)(?:\D|$)/); if (!m) return 1;
  const now = new Date(); const startYY = (now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1) % 100;
  const c = startYY - Number(m[1]) + 1; return c >= 1 && c <= 3 ? c : 1;
}

/* ---------- мелкие компоненты ---------- */
const Btn = ({ kind = "", sm, children, ...rest }) => html`<button className=${`btn ${kind} ${sm ? "sm" : ""}`} ...${rest}>${children}</button>`;
const Chip = ({ map, k, extra }) => { const [t, c] = map[k] || ["", ""]; return html`<span className=${"chip " + c}>${t}${extra || ""}</span>`; };
const Field = ({ label, children }) => html`<label className="f"><span>${label}</span>${children}</label>`;
const Progress = ({ v, t }) => { const pct = t ? Math.round((v / t) * 100) : 0; return html`<div className="row" style=${{ flexWrap: "nowrap" }}><div className=${"bar" + (pct === 100 ? " full" : "")}><i style=${{ width: pct + "%" }}></i></div><span className="small muted num">${v}/${t}</span></div>`; };
function Confirm({ text, onYes, children, kind = "warn" }) {
  const [ask, setAsk] = useState(false);
  if (!ask) return html`<${Btn} sm kind=${kind} onClick=${() => setAsk(true)}>${children}<//>`;
  return html`<span className="row small"><span>${text}</span><${Btn} sm kind="warn" onClick=${() => { setAsk(false); onYes(); }}>Да<//><${Btn} sm kind="ghost" onClick=${() => setAsk(false)}>Нет<//></span>`;
}

/* =================== ОБЗОР (старший мастер) =================== */
function Overview({ practices }) {
  const [filter, setFilter] = useState("now");
  const [open, setOpen] = useState(null);
  const list = practices.filter((p) => filter === "all" || phase(p) === filter);
  const act = practices.filter((p) => phase(p) === "now");
  const allOrgs = act.flatMap((p) => p.orgs);
  const pending = act.reduce((a, p) => a + p.students.reduce((b, s) => b + (s.stats.sent || 0), 0), 0);
  const alerts = [];
  practices.forEach((p) => {
    const ph = phase(p);
    if (ph === "done") { const miss = p.students.filter((s) => !s.stats.char).length; if (miss) alerts.push(["bad", `${p.groupName}: практика завершена, нет характеристик — ${miss}`]); return; }
    const un = p.students.filter((s) => !s.org).length;
    if (un) alerts.push([ph === "now" ? "bad" : "", `${p.groupName}: ${un} студ. не распределены по организациям`]);
    p.orgs.forEach((o) => { if (o.contract !== "returned" && (ph === "now" || o.contract === "draft")) alerts.push([ph === "now" ? "bad" : "", `${p.groupName}: договор с ${o.name} — ${CONTRACT[o.contract][0].toLowerCase()}`]); });
  });
  return html`<div className="stack">
    <div className="row between"><h2>Группы на практике</h2>
      <div className="tabs" role="tablist">${[["now", "Идут"], ["soon", "Скоро"], ["done", "Завершены"], ["all", "Все"]].map(([k, t]) => html`<button key=${k} role="tab" aria-selected=${filter === k} onClick=${() => setFilter(k)}>${t}</button>`)}</div></div>
    <div className="grid4">
      <div className="card stat"><div className="v">${act.length}</div><div className="l">групп сейчас на практике</div></div>
      <div className="card stat"><div className="v">${act.reduce((a, p) => a + p.students.length, 0)}</div><div className="l">студентов на практике</div></div>
      <div className="card stat"><div className="v">${allOrgs.filter((o) => o.contract === "returned").length}/${allOrgs.length}</div><div className="l">договоров сдано в лицей</div></div>
      <div className="card stat"><div className="v">${pending}</div><div className="l">записей ждут руководителя</div></div>
    </div>
    ${alerts.length > 0 && html`<div className="stack" style=${{ gap: 6 }}>${alerts.map((a, i) => html`<div key=${i} className=${"alert " + a[0]}>${a[1]}</div>`)}</div>`}
    <div className="card tbl" style=${{ padding: 0 }}>
      <table className="list"><thead><tr><th>Группа</th><th>Мастер п/о</th><th>Срок</th><th>Распределено</th><th>Договоры</th><th>Дневники</th><th>Характеристики</th></tr></thead>
      <tbody>${list.length === 0 && html`<tr><td colSpan="7" className="empty">${practices.length ? "В этом разделе групп нет." : "Пока ни одна группа не отправлена на практику. Мастера п/о делают это во вкладке «Практики»."}</td></tr>`}
      ${list.map((p) => {
        const okDays = p.students.reduce((a, s) => a + (s.stats.ok || 0), 0);
        return html`<${React.Fragment} key=${p._id}>
          <tr className="click" onClick=${() => setOpen(open === p._id ? null : p._id)}>
            <td><b>${p.groupName}</b> <${Chip} map=${PHASE} k=${phase(p)} /><div className="small muted">${p.course} курс, ${p.days[0]?.hours || ""} ч/день</div></td>
            <td>${short(p.master?.name || "")}</td>
            <td className="num small">${fmt(p.start)}–${fmt(p.end)}</td>
            <td className="num">${p.students.filter((s) => s.org).length}/${p.students.length}</td>
            <td className="num">${p.orgs.filter((o) => o.contract === "returned").length}/${p.orgs.length}</td>
            <td style=${{ minWidth: 120 }}><${Progress} v=${okDays} t=${p.days.length * p.students.length} /></td>
            <td className="num">${p.students.filter((s) => s.stats.char).length}/${p.students.length}</td></tr>
          ${open === p._id && html`<tr><td colSpan="7" style=${{ background: "#F7F9FC" }}><${PracticeDetail} p=${p} /></td></tr>`}
        <//>`;
      })}</tbody></table></div>
  </div>`;
}
function PracticeDetail({ p }) {
  const un = p.students.filter((s) => !s.org);
  return html`<div className="stack" style=${{ gap: 10 }}>
    <div className="small muted">Мастер п/о: ${p.master?.name || "—"}${p.master?.phone ? ", тел. " + p.master.phone : ""}. ${p.profession}. ${p.days.length} дн., ${p.hoursTotal} ч.</div>
    ${p.orgs.map((o) => html`<div key=${o._id} className="card tight">
      <div className="row between"><div><b>${o.name}</b><div className="small muted">${o.supName}, ${o.supPos}${o.supPhone ? ", " + o.supPhone : ""}</div></div>
        <div className="row"><${Chip} map=${CONTRACT} k=${o.contract} /><${Btn} sm kind="ghost" onClick=${run(() => download(`/api/practice/practices/${p._id}/orgs/${o._id}/contract.docx`))}>Договор<//></div></div>
      <div className="stack" style=${{ gap: 4, marginTop: 8 }}>${p.students.filter((s) => String(s.org) === String(o._id)).map((s) => html`<div key=${s.student} className="grid3 small" style=${{ alignItems: "center" }}>
          <button className="linkbtn" onClick=${run(() => download(`/api/practice/practices/${p._id}/students/${s.student}/diary.docx`))}>${s.fio}</button>
          <${Progress} v=${s.stats.ok || 0} t=${p.days.length} />
          <span>${s.stats.sent ? html`<span className="chip st-sent">на проверке: ${s.stats.sent}</span> ` : ""}${s.stats.back ? html`<span className="chip st-back">на доработке: ${s.stats.back}</span> ` : ""}${s.stats.char ? html`<button className="chip st-ok linkbtn" onClick=${run(() => download(`/api/practice/practices/${p._id}/students/${s.student}/characteristic.docx`))}>характеристика ${s.stats.char}</button>` : ""}</span></div>`)}</div></div>`)}
    ${un.length > 0 && html`<div className="alert">Не распределены: ${un.map((s) => short(s.fio)).join(", ")}</div>`}
  </div>`;
}

/* =================== ПРАКТИКИ (мастер п/о) =================== */
function Practices({ me, settings, practices, reload, replace }) {
  const [creating, setCreating] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const active = practices.filter((p) => phase(p) !== "done");
  const done = practices.filter((p) => phase(p) === "done");
  return html`<div className="stack">
    <div className="row between"><h2>${me.role === "admin" ? "Все практики" : "Мои группы на практике"}</h2>
      <${Btn} kind=${creating ? "ghost" : ""} onClick=${() => setCreating(!creating)}>${creating ? "Отмена" : "Отправить группу на практику"}<//></div>
    ${creating && html`<${NewPractice} me=${me} settings=${settings} onDone=${(p) => { setCreating(false); reload(); }} />`}
    ${!practices.length && !creating && html`<div className="card empty">Групп на практике пока нет. Нажмите «Отправить группу на практику» — список студентов подтянется из базы лицея.</div>`}
    ${active.map((p) => html`<${PracticeManage} key=${p._id} p=${p} settings=${settings} replace=${replace} reload=${reload} />`)}
    ${done.length > 0 && html`<div><button className="linkbtn" onClick=${() => setShowDone(!showDone)}>${showDone ? "Скрыть завершённые" : `Завершённые практики (${done.length})`}</button></div>`}
    ${showDone && done.map((p) => html`<${PracticeManage} key=${p._id} p=${p} settings=${settings} replace=${replace} reload=${reload} />`)}
  </div>`;
}

function NewPractice({ me, settings, onDone }) {
  const [groups, setGroups] = useState(null);
  const [gid, setGid] = useState("");
  const [students, setStudents] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [f, setF] = useState({ course: 1, hours: settings.hoursByCourse?.[1] || 6, profession: "", start: "", end: "", sat: true, mName: me.name || "", mPhone: me.phone || "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  useEffect(() => { api("/api/practice/groups").then(setGroups).catch((e) => setErr(e.message)); }, []);
  const pick = async (id) => {
    setGid(id); setStudents([]); if (!id) return;
    const g = groups.find((x) => x._id === id); const course = guessCourse(g.name);
    setF((x) => ({ ...x, course, hours: settings.hoursByCourse?.[course] || x.hours, profession: g.profRu || x.profession }));
    try { setStudents((await api(`/api/practice/groups/${id}/students`)).map((s) => ({ ...s, on: true }))); } catch (e) { setErr(e.message); }
  };
  const create = async () => {
    setErr("");
    if (!gid) return setErr("Выберите группу.");
    if (!f.start || !f.end) return setErr("Укажите даты практики.");
    if (!f.mName.trim()) return setErr("Укажите ФИО мастера п/о — оно печатается в договоре.");
    setBusy(true);
    try {
      const p = await api("/api/practice/practices", { method: "POST", body: { groupId: gid, studentIds: students.filter((s) => s.on).map((s) => s._id), course: f.course, hours: f.hours, profession: f.profession, start: f.start, end: f.end, sat: f.sat, master: { name: f.mName, phone: f.mPhone } } });
      toast("Практика создана — добавьте организации"); onDone(p);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  return html`<div className="card stack">
    <h3>Группа и студенты</h3>
    ${groups === null ? html`<p className="muted small">Загружаю группы…</p>` : html`
      <${Field} label="Группа"><select id="grp" value=${gid} onChange=${(e) => pick(e.target.value)}><option value="">Выберите группу</option>${groups.map((g) => html`<option key=${g._id} value=${g._id}>${g.name}${g.profRu ? " — " + g.profRu : ""}</option>`)}</select><//>`}
    ${students.length > 0 && html`<div className="card tight" style=${{ background: "#FAFBFD" }}>
      <div className="row between small" style=${{ marginBottom: 6 }}><span className="muted">Идут на практику: ${students.filter((s) => s.on).length} из ${students.length}. Снимите отметку с тех, кто не идёт.</span>
        <span className="row"><button className="linkbtn" onClick=${() => setStudents(students.map((s) => ({ ...s, on: true })))}>Все</button><button className="linkbtn" onClick=${() => setStudents(students.map((s) => ({ ...s, on: false })))}>Никого</button></span></div>
      <div className="grid2" style=${{ gap: 4 }}>${students.map((s, i) => html`<label key=${s._id} className="row small" style=${{ flexWrap: "nowrap" }}><input type="checkbox" checked=${s.on} onChange=${() => setStudents(students.map((x, j) => (j === i ? { ...x, on: !x.on } : x)))} />${s.fio}</label>`)}</div></div>`}
    ${gid && !students.length && html`<p className="small muted">В этой группе нет студентов в базе.</p>`}
    <h3>Сроки и часы</h3>
    <div className="grid3">

    <div className="grid3">

function TemplatesView({ settings, setSettings }) {
  const [tpls, setTpls] = useState([]);
  const load = () => api("/api/practice/templates").then(setTpls).catch((e) => toast(e.message, true));
  useEffect(() => { load(); }, []);
  const upload = (name) => run(async (e) => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    const fd = new FormData(); fd.append("file", file);
    await api(`/api/practice/templates/${name}`, { method: "POST", body: fd }); await load();
  }, "Шаблон загружен");
  return html`<div className="stack">
    <h2>Шаблоны документов</h2>
    <div className="note small">Как изменить документ: скачайте шаблон, поправьте его в Word как обычный документ и загрузите обратно. Слова в фигурных скобках — это метки, вместо них система подставит данные. Метку можно перенести в другое место или удалить, но набирайте её целиком, без смены шрифта внутри скобок.</div>
    ${tpls.map((t) => html`<div key=${t.name} className="card stack" style=${{ gap: 8 }}>
      <div className="row between"><div><h3>${t.title}</h3><div className="small muted">${t.custom ? `Ваш шаблон, загружен ${new Date(t.uploadedAt).toLocaleDateString("ru-RU")}` : "Стандартный шаблон"}</div></div>
        <div className="row"><${Btn} sm kind="ghost" onClick=${run(() => download(`/api/practice/templates/${t.name}`))}>Скачать шаблон<//>
          <label className="btn sm" style=${{ cursor: "pointer" }}>Загрузить свой .docx<input type="file" accept=".docx" hidden onChange=${upload(t.name)} /></label>
          ${t.custom && html`<${Confirm} kind="ghost" text="Вернуть стандартный шаблон?" onYes=${run(async () => { await api(`/api/practice/templates/${t.name}`, { method: "DELETE" }); await load(); }, "Стандартный шаблон восстановлен")}>Вернуть стандартный<//>`}</div></div>
      <details><summary className="small" style=${{ cursor: "pointer", color: "var(--ink)" }}>Доступные метки</summary><p className="small" style=${{ lineHeight: 1.9 }}>${t.tags.split(" ").map((x, i) => html`<code key=${i} style=${{ marginRight: 4 }}>${x}</code>`)}</p></details>
    </div>`)}
    <${SettingsForm} settings=${settings} setSettings=${setSettings} />
  </div>`;
}

    <div className="grid4">${[1, 2, 3].map((c) => html`<${Field} key=${c} label=${`Часов в день, ${c} курс`}><input id=${"s-h" + c} type="number" min="1" max="12" value=${s.hoursByCourse?.[c] || ""} onInput=${(e) => setS({ ...s, hoursByCourse: { ...s.hoursByCourse, [c]: Number(e.target.value) } })} /><//>`)}</div>
    <${Field} label="Инструктаж по ТБ по умолчанию"><input id="s-tb" value=${s.tbDefault} onInput=${set("tbDefault")} /><//>
    ${GRP.map(([g, t]) => html`<div key=${g} className="stack" style=${{ gap: 6 }}><b className="small">${t}</b>${[5, 4, 3].map((l) => html`<${Field} key=${l} label=${`Уровень ${l}`}><textarea id=${`s-${g}${l}`} rows="2" value=${s.phrases?.[g]?.[l] || ""} onInput=${setPh(g, l)}></textarea><//>`)}</div>`)}
    <div className="grid2">
      <${Field} label="Личные качества (по одному на строку)"><textarea id="s-q" rows="6" value=${Array.isArray(s.qualities) ? s.qualities.join("\n") : s.qualities} onInput=${set("qualities")}></textarea><//>
      <${Field} label="Разряды (по одному на строку)"><textarea id="s-r" rows="6" value=${Array.isArray(s.ranks) ? s.ranks.join("\n") : s.ranks} onInput=${set("ranks")}></textarea><//>
    </div>
    <div><${Btn} onClick=${save}>Сохранить настройки<//></div>
  </div>`;
}

/* =================== приложение =================== */
function App() {
  const [me, setMe] = useState(null);
  const [settings, setSettings] = useState(null);
  const [practices, setPractices] = useState(null);
  const [tab, setTab] = useState(null);
  const [err, setErr] = useState("");
  const reload = useCallback(() => api("/api/practice/practices").then(setPractices).catch((e) => setErr(e.message)), []);
  const replace = (p) => setPractices((list) => list.map((x) => (x._id === p._id ? p : x)));
  useEffect(() => {
    Promise.all([api("/api/practice/me"), api("/api/practice/settings")]).then(([m, s]) => {
      TODAY = m.today || TODAY; setMe(m); setSettings(s);
      let t = null; try { t = localStorage.getItem("pl3-practice-tab"); } catch (e) {}
      setTab(m.role === "admin" ? (t || "overview") : "practices");
    }).catch((e) => setErr(e.message));
    reload();
  }, []);
  const pick = (t) => { setTab(t); try { localStorage.setItem("pl3-practice-tab", t); } catch (e) {} };
  if (err) return html`<div className="wrap" style=${{ paddingBlock: 20 }}><div className="alert bad">${err}</div></div>`;
  if (!me || !settings || !practices) return html`<p className="wrap" style=${{ paddingBlock: 20 }}>Загрузка…</p>`;
  const tabs = me.role === "admin" ? [["overview", "Обзор"], ["practices", "Практики"], ["templates", "Шаблоны и настройки"]] : [["practices", "Мои группы"]];
  return html`<${React.Fragment}>
    <header className="top"><div className="wrap">
      <div className="brand">Производственная практика</div>
      ${tabs.length > 1 && html`<div className="tabs" role="tablist">${tabs.map(([k, t]) => html`<button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => pick(k)}>${t}</button>`)}</div>`}
      <div className="row small"><span className="muted">${me.role === "admin" ? "Старший мастер" : "Мастер п/о"}: ${me.name}</span><span className="muted">·</span>
        <a className="linkbtn" href=${me.role === "admin" ? "/" : "/summary.html"}>${me.role === "admin" ? "Админ-панель" : "Кабинет куратора"}</a><span className="muted">·</span><a className="linkbtn" href="/logout">Выйти</a></div>
    </div></header>
    <main className="wrap">
      ${tab === "overview" && html`<${Overview} practices=${practices} />`}
      ${tab === "practices" && html`<${Practices} me=${me} settings=${settings} practices=${practices} reload=${reload} replace=${replace} />`}
      ${tab === "templates" && html`<${TemplatesView} settings=${settings} setSettings=${setSettings} />`}
    </main>
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
